<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COINT, Zürich to Amsterdam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17183a; --ink:#f6f0ff; --ink-dim:#cbc5ee; --chip:rgba(23,24,58,.62); --edge:rgba(246,240,255,.14); --btn:rgba(246,240,255,.1); --btn-h:rgba(246,240,255,.22); --accent:#ffd27a;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101130;--ink:#f6f0ff;--ink-dim:#bdb7e6;--chip:rgba(12,13,36,.66);--edge:rgba(246,240,255,.12);--btn:rgba(246,240,255,.1);--btn-h:rgba(246,240,255,.22);--accent:#ffd27a;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101130;--ink:#f6f0ff;--ink-dim:#bdb7e6;--chip:rgba(12,13,36,.66);--edge:rgba(246,240,255,.12);--btn:rgba(246,240,255,.1);--btn-h:rgba(246,240,255,.22);--accent:#ffd27a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none}
#scene{position:fixed;left:0;top:0;display:block;image-rendering:crisp-edges;image-rendering:pixelated;touch-action:none;cursor:grab}
body.drag #scene{cursor:grabbing}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));pointer-events:none}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.chip{font-family:"Silkscreen",ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--chip);border:1px solid var(--edge);border-radius:6px}
.place{padding:8px 12px 9px;flex:none}
.place b{display:block;font-weight:400;font-size:22px;line-height:1;letter-spacing:.04em}
.place span{display:block;margin-top:5px;font-size:11px;color:var(--ink-dim);letter-spacing:.04em}
.ctrl{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;padding:8px;max-width:min(380px,58vw)}
.ctrl .pts{width:100%;text-align:right;font-size:11px;color:var(--ink-dim);letter-spacing:.03em}
.bar{width:100%;height:4px;background:var(--btn);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s ease}
button{font:inherit;font-size:11px;letter-spacing:.03em;color:var(--ink);background:var(--btn);border:1px solid var(--edge);border-radius:4px;padding:6px 9px;cursor:pointer}
button:hover:not(:disabled){background:var(--btn-h)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.hint{padding:6px 10px;font-size:11px;letter-spacing:.04em;transition:opacity 1.2s ease}
.hint.gone{opacity:0}
@media (prefers-reduced-motion:reduce){.hint,.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="Animated pixel-art journey: a quant intern skateboards through snowy Zürich, flies from Zürich Airport, and lands in rainy Amsterdam"></canvas>
<div class="top">
  <div class="chip place"><b id="city">Zürich</b><span id="sub">Stop 1 of 6</span></div>
  <div class="chip ctrl">
    <div class="pts" id="pts">0 of 100 points in Zürich</div>
    <div class="bar"><i id="bar"></i></div>
    <button id="add" type="button">Add 20 points</button>
    <button id="finish" type="button">Finish this city</button>
    <button id="reset" type="button">Restart</button>
  </div>
</div>
<div class="bottom"><div class="chip hint" id="hint">Add points to ride through the city. Drag to look around.</div></div>
<script>

(() => {
'use strict';

/* ================= core ================= */
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d', { alpha: false });
const hintEl = document.getElementById('hint');
const SPAN = 1440;
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SNOW = '#eef0ff', SNOWS = '#c9cdf0', SNOWM = '#dde0f8', ICE = '#cfdcff';

let W = 0, H = 0, S = 1, L = null, flakes = [];
const Y = yb => H - yb;

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const toHex = c => '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const MIXC = new Map();
const mix = (a, b, t) => { const k = a + b + t; let v = MIXC.get(k); if (!v) { const A = hex(a), B = hex(b); v = toHex(A.map((q, i) => q + (B[i] - q) * t)); MIXC.set(k, v); } return v; };
const dk = (c, t) => mix(c, '#1c1a3c', t);
const lt = (c, t) => mix(c, '#fff6ee', t);
const mod = (a, n) => ((a % n) + n) % n;
const lin = (r, n) => { const v = Array.from({ length: n }, () => r()); return x => { const i = Math.floor(x), f = x - i, a = v[mod(i, n)], b = v[mod(i + 1, n)]; return a + (b - a) * f; }; };
const smo = (r, n) => { const v = Array.from({ length: n }, () => r()); return x => { const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f), a = v[mod(i, n)], b = v[mod(i + 1, n)]; return a + (b - a) * s; }; };
const dith = (x, y, f) => f * 16 > BAYER[((y & 3) << 2) | (x & 3)];
const R = (g, c, x, y, w, h) => { w = Math.round(w); h = Math.round(h); if (w <= 0 || h <= 0) return; g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const P1 = (g, c, x, y) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); };
const pick = (r, a) => a[Math.floor(r() * a.length)];

function Buf(w, h) {
  const c = mk(w, h), g = c.getContext('2d'), img = g.createImageData(c.width, c.height), d = img.data, bw = c.width, bh = c.height;
  return { c, w: bw, h: bh,
    set(x, y, col) { if (!col || x < 0 || y < 0 || x >= bw || y >= bh) return; const i = (y * bw + x) << 2; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = 255; },
    done() { g.putImageData(img, 0, 0); return c; } };
}
function sprite(rows, pal) {
  const c = mk(rows[0].length, rows.length), g = c.getContext('2d');
  rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const col = pal[row[x]]; if (col) P1(g, col, x, y); } });
  return c;
}
function flip(src, horizontal) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  if (horizontal) { g.translate(src.width, 0); g.scale(-1, 1); } else { g.translate(0, src.height); g.scale(1, -1); }
  g.drawImage(src, 0, 0); return c;
}
function line(g, x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (let i = 0; i < 200; i++) {
    P1(g, c, x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function disc(g, cx, cy, rad, c, cs) {
  for (let dy = -Math.ceil(rad); dy <= Math.ceil(rad); dy++) for (let dx = -Math.ceil(rad); dx <= Math.ceil(rad); dx++) {
    if (Math.hypot(dx, dy) <= rad) P1(g, cs && dx < -rad * 0.3 ? cs : c, cx + dx, cy + dy);
  }
}
function glowSprite(rad, col, k) {
  const s = rad * 2 + 1, c = mk(s, s), g = c.getContext('2d');
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const d = Math.hypot(x - rad, y - rad) / rad;
    if (d < 1 && dith(x, y, (1 - d) * k)) P1(g, col, x, y);
  }
  return c;
}
function stoneWall(g, c, x, y, w, h, rowH) {
  R(g, c, x, y, w, h);
  const j = dk(c, 0.13);
  for (let yy = y + rowH - 1, row = 0; yy < y + h; yy += rowH, row++) {
    for (let xx = x; xx < x + w; xx++) if (dith(xx, yy, 0.75)) P1(g, j, xx, yy);
    for (let xx = x + (row % 2 ? 3 : 7); xx < x + w; xx += 9) R(g, j, xx, yy - rowH + 1, 1, rowH - 1);
  }
  R(g, dk(c, 0.16), x, y, 3, h); R(g, lt(c, 0.12), x + w - 1, y, 1, h);
}
function ledge(g, c, x, y, w) { R(g, lt(c, 0.22), x - 1, y, w + 2, 2); R(g, dk(c, 0.3), x, y + 2, w, 1); R(g, SNOW, x - 1, y - 1, w + 2, 1); }
function icicles(g, r, x0, x1, y, out) {
  for (let xx = x0; xx < x1; xx++) {
    if (r() < 0.3) {
      const len = 1 + Math.floor(r() * r() * 6);
      for (let j = 0; j < len; j++) P1(g, j === len - 1 ? '#ffffff' : ICE, xx, y + j);
      if (out && len >= 3 && r() < 0.35) out.spark.push({ x: xx, y: y + len - 1, ph: r() * 6.283 });
    }
  }
}

/* ================= windows ================= */
const GLASS_D = '#2a2b54', GLASS_R = '#464b86';
const CURT = ['#f3e0c8', '#e8c6c6', '#d9e4c8', '#cfd8ef', '#f0d6a8'];
function litGlass(lg, r, gx, gy, gw, gh) {
  for (let yy = 0; yy < gh; yy++) {
    const f = yy / Math.max(1, gh - 1);
    R(lg, f < 0.35 ? '#ffe9b4' : f < 0.75 ? '#ffd383' : '#f2ad5e', gx, gy + yy, gw, 1);
  }
  if (gw >= 4 && r() < 0.65) { const cc = pick(r, CURT); R(lg, cc, gx, gy, 1, gh); R(lg, cc, gx + gw - 1, gy, 1, gh); P1(lg, dk(cc, 0.2), gx, gy + Math.floor(gh * 0.6)); P1(lg, dk(cc, 0.2), gx + gw - 1, gy + Math.floor(gh * 0.6)); }
  const ex = r(), mid = gx + Math.floor(gw / 2);
  if (ex < 0.13 && gw >= 4 && gh >= 6) {
    P1(lg, '#b88a4a', mid, gy); P1(lg, '#fffbe8', mid, gy + 2);
    P1(lg, '#fff1c0', mid - 1, gy + 2); P1(lg, '#fff1c0', mid + 1, gy + 2); P1(lg, '#fff1c0', mid, gy + 1); P1(lg, '#fff1c0', mid, gy + 3);
  } else if (ex < 0.23 && gw >= 5) {
    const by = gy + gh - 2;
    R(lg, '#4a3030', gx + 1, by, gw - 2, 1);
    for (let i = 1; i < gw - 1; i += 2) P1(lg, '#fffbe0', gx + i, by - 1 - (Math.abs(gx + i - mid) < 1 ? 1 : 0));
  } else if (ex < 0.33) {
    const px = gx + 1 + Math.floor(r() * Math.max(1, gw - 3));
    R(lg, '#3d5a3a', px, gy + gh - 3, 2, 2); P1(lg, '#4f7a4a', px, gy + gh - 4); R(lg, '#8a5a3a', px, gy + gh - 1, 2, 1);
  } else if (ex < 0.4 && gh >= 7 && gw >= 4) {
    const px = gx + Math.floor(r() * Math.max(1, gw - 3));
    R(lg, '#7a5650', px, gy + gh - 3, 3, 3); R(lg, '#7a5650', px + 1, gy + gh - 5, 1, 2); P1(lg, '#7a5650', px, gy + gh - 4); P1(lg, '#7a5650', px + 2, gy + gh - 4);
  } else if (ex < 0.5) {
    P1(lg, '#8a6a4a', mid, gy); P1(lg, '#fffbe8', mid, gy + 1);
  }
}
function glassPair(g, lg, r, gx, gy, gw, gh, list, th) {
  R(g, GLASS_D, gx, gy, gw, gh);
  for (let yy = 0; yy < gh; yy++) for (let xx = 0; xx < gw; xx++) { const s = xx + yy; if (s === 1 || s === 2) P1(g, GLASS_R, gx + xx, gy + yy); }
  litGlass(lg, r, gx, gy, gw, gh);
  if (gw >= 4) { R(g, '#cfcbe0', gx + Math.floor(gw / 2), gy, 1, gh); R(lg, '#6b5048', gx + Math.floor(gw / 2), gy, 1, gh); }
  if (gh >= 6) { const my = gy + Math.floor(gh * 0.36); R(g, '#cfcbe0', gx, my, gw, 1); R(lg, '#6b5048', gx, my, gw, 1); }
  list.push({ x: gx, y: gy, w: gw, h: gh, kind: r() < 0.05 ? 'tv' : 'warm', ph: r() * 6.283, sp: 0.01 + r() * 0.05, th: th !== undefined ? th : -0.8 + r() * 1.25 });
}
function windowAt(g, lg, r, x, y, w, h, o, list) {
  const trim = o.trim;
  R(g, o.frame || trim, x, y, w, h);
  glassPair(g, lg, r, x + 1, y + 1, w - 2, h - 2, list, o.th);
  if (o.lintel === 'flat') { R(g, trim, x - 1, y - 2, w + 2, 2); R(g, SNOW, x - 1, y - 3, w + 2, 1); }
  else if (o.lintel === 'ped') { for (let k = 0; k < 3; k++) R(g, k === 0 ? dk(trim, 0.15) : trim, x - 1 + k, y - 2 - k, w + 2 - 2 * k, 1); R(g, SNOW, x + 1, y - 5, w - 2, 1); P1(g, SNOW, x, y - 4); P1(g, SNOW, x + w - 1, y - 4); }
  else if (o.lintel === 'arch') { R(g, trim, x, y - 1, w, 1); R(g, trim, x + 1, y - 2, w - 2, 1); R(g, SNOW, x + 1, y - 3, w - 2, 1); P1(g, lt(trim, 0.35), x + Math.floor(w / 2), y - 2); }
  R(g, SNOW, x - 1, y + h, w + 2, 1); R(g, dk(trim, 0.3), x - 1, y + h + 1, w + 2, 1);
  if (o.shut) for (const sx of [x - 3, x + w]) {
    R(g, o.shut, sx, y, 3, h);
    for (let yy = y + 1; yy < y + h - 1; yy += 2) R(g, dk(o.shut, 0.3), sx, yy, 3, 1);
    R(g, dk(o.shut, 0.45), sx === x - 3 ? sx : sx + 2, y, 1, h);
    if (r() < 0.7) R(g, SNOW, sx, y - 1, 3, 1);
  }
  if (o.box) {
    R(g, '#6b4a3a', x, y + h + 2, w, 3); R(g, '#4a3026', x, y + h + 4, w, 1);
    for (let i = 0; i < w; i++) {
      if (r() < 0.75) P1(g, pick(r, ['#2f5a3f', '#3c6b48', '#24452f']), x + i, y + h + 1);
      if (r() < 0.4) P1(g, pick(r, ['#2f5a3f', '#3c6b48']), x + i, y + h);
      if (r() < 0.14) P1(g, '#d83a44', x + i, y + h + 1);
      if (r() < 0.3) P1(g, SNOW, x + i, y + h - (r() < 0.5 ? 0 : 1));
    }
  }
}

/* ================= sky ================= */
function genSky() {
  const b = Buf(W, H), hz = Y(228);
  const st = ['#141536', '#1f2052', '#2c2d68', '#423f80', '#5f5296', '#8564a3', '#ad74a8', '#d388a8', '#ec9fa6', '#f6b9a2'].map(hex);
  for (let y = 0; y < H; y++) {
    const t = Math.min(1, Math.max(0, y / hz)), ft = t * (st.length - 1);
    const i = Math.min(st.length - 2, Math.floor(ft)), f = ft - i;
    for (let x = 0; x < W; x++) b.set(x, y, dith(x, y, f) ? st[i + 1] : st[i]);
  }
  const mx = Math.round(W * 0.74), my = Math.max(22, Y(398)), R0 = 10.5;
  const mc = hex('#f4f0ff'), md = hex('#d8d2f0'), me = hex('#e4def6'), mg = hex('#7d74b4');
  const craters = [[-4, -2, 2.6], [3, 3, 2.1], [2, -5, 1.4], [-2, 5, 1.6], [5, -1, 1.2], [-6, 3, 1]];
  for (let y = -28; y <= 28; y++) for (let x = -28; x <= 28; x++) {
    const d = Math.hypot(x, y), px = mx + x, py = my + y;
    if (d <= R0) {
      let col = mc;
      for (const [a, bb, cr] of craters) if (Math.hypot(x - a, y - bb) < cr) col = md;
      if (d > R0 - 1.3 && x < 0) col = me;
      b.set(px, py, col);
    } else if (d < 26 && dith(px, py, ((26 - d) / 15.5) * 0.42)) b.set(px, py, mg);
  }
  const r = rng(11), stars = [], n = Math.round(W * hz / 700);
  for (let i = 0; i < n; i++) {
    const x = Math.floor(r() * W), y = Math.floor(Math.pow(r(), 1.6) * hz * 0.66);
    if (Math.hypot(x - mx, y - my) < 28) continue;
    stars.push({ x, y, ph: r() * 6.283, sp: 0.6 + r() * 2, big: r() < 0.07 });
  }
  return { c: b.done(), stars, moon: { x: mx, y: my } };
}

/* ================= Alps ================= */
function genAlps(p, seed, baseYb, amp, pal, snowAt) {
  const lw = Math.ceil(W + p * SPAN) + 8, b = Buf(lw, H), r = rng(seed);
  const n1 = lin(r, 64), n2 = lin(r, 64), n3 = lin(r, 64), n4 = smo(r, 64), n5 = smo(r, 64), n6 = lin(r, 64), n7 = lin(r, 64);
  const ht = new Float32Array(lw + 8);
  for (let x = 0; x < lw + 8; x++) {
    let v = 0.58 * n1(x / 68) + 0.28 * n2(x / 26) + 0.14 * n3(x / 9);
    v = Math.pow(v, 1.5) * 1.55;
    ht[x] = amp * Math.min(1, v) * (0.78 + 0.32 * n4(x / 140));
  }
  const base = Y(baseYb), C = {};
  for (const k in pal) C[k] = hex(pal[k]);
  for (let x = 0; x < lw; x++) {
    const top = Math.round(base - ht[x]);
    const lit = ht[Math.min(lw + 7, x + 3)] - ht[Math.max(0, x - 3)] < 0;
    const snowY = base - snowAt - 14 * n5(x / 12) + 34 * Math.max(0, n7(x / 3.5) - 0.6);
    for (let y = Math.max(0, top); y <= base + 2 && y < H; y++) {
      const dep = y - top;
      let col;
      if (y < snowY) col = lit ? (dep < 3 ? C.glow : C.snow) : (dep < 2 ? C.edge : C.snowS);
      else if (y < snowY + 6 && dith(x, y, (snowY + 6 - y) / 6)) col = lit ? C.snow : C.snowS;
      else { col = lit ? C.rock : C.rockS; if (n6(x / 2.5 + y * 0.02) > 0.74) col = C.rockD; }
      const hz = (y - (base - 24)) / 24;
      if (hz > 0 && dith(x, y, hz * 0.85)) col = C.haze;
      b.set(x, y, col);
    }
  }
  return { p, c: b.done() };
}

/* ================= Uetliberg and Zürichberg ================= */
function genHills() {
  const p = 0.2, lw = Math.ceil(W + p * SPAN) + 8, c = mk(lw, H), g = c.getContext('2d'), r = rng(77);
  const n = smo(r, 64), n2 = lin(r, 64), base = Y(228);
  const bump = (x, m, w) => Math.exp(-(((x - m) / w) ** 2));
  const ht = x => 10 + 48 * bump(x, 148, 128) + 26 * bump(x, lw - 100, 160) + 12 * n(x / 52) + 3 * n2(x / 8);
  const tops = [];
  for (let x = 0; x < lw; x++) {
    const top = Math.round(base - ht(x)); tops.push(top);
    R(g, '#2b3561', x, top, 1, base - top + 3);
    P1(g, '#8890c2', x, top); P1(g, '#6f78ad', x, top + 1);
    if (dith(x, top + 2, 0.5)) P1(g, '#5c66a0', x, top + 2);
    if (dith(x, top + 3, 0.25)) P1(g, '#4a5490', x, top + 3);
  }
  const pine = (x, y, h) => {
    R(g, '#3a2a35', x, y - 1, 1, 2);
    for (let k = 0; k < h; k++) {

  for (let x = 0; x < W; x++) { const gv = n(x / 30); if (gv > 0.5) for (let y = gY - 26; y < gY; y++) if (dith(x, y, (gv - 0.5) * 2 * ((y - gY + 26) / 26))) P1(g, '#c48a4e', x, y); }
  const bands = ['#13262a', '#162d2f', '#11211f', '#183230', '#122628'];
  let y = gY, bi = 0, step = 2;
  while (y < Y(60)) { R(g, bands[bi % bands.length], 0, y, W, step); for (let x = 0; x < W; x++) if (dith(x, y, 0.5)) P1(g, '#3a5a5e', x, y); y += step + 1; step = Math.min(10, step + 1); bi++; }
  for (let x = 0; x < W; x++) { P1(g, '#0d1c20', x, gY); if (n(x / 6 + 5) > 0.55) R(g, '#0d1c20', x, gY - 6 - Math.round(n(x / 3) * 4), 1, 7); }
  for (const [mx, sz] of [[Math.round(W * 0.12), 0.9], [Math.round(W * 0.3), 0.7], [Math.round(W * 0.92), 1]]) {
    const hgt = Math.round(30 * sz);
    for (let k = 0; k < hgt; k++) { const w = Math.round((12 - k * 0.17) * sz); R(g, '#0b181c', mx - Math.floor(w / 2), gY - k, w, 1); }
    R(g, '#0b181c', mx - 5, gY - hgt - 4, 10, 5); P1(g, '#e0a050', mx, gY - 4);
    mills.push({ x: mx, y: gY - hgt - 2, r: Math.round(20 * sz) });
  }
  const tx = Math.round(W * 0.72);
  R(g, '#1a2c32', tx - 3, gY - 96, 6, 96); R(g, '#2a4048', tx + 2, gY - 96, 1, 96);
  for (let k = 0; k < 4; k++) R(g, '#1a2c32', tx - 4 - k * 1.5, gY - 97 - k, 8 + k * 3, 1);
  R(g, '#8fd8d0', tx - 10, gY - 108, 20, 6); for (let xx = tx - 10; xx < tx + 10; xx += 4) R(g, '#1a2c32', xx, gY - 108, 1, 6);
  R(g, '#1a2c32', tx - 11, gY - 111, 22, 3); R(g, '#1a2c32', tx, gY - 122, 1, 11);
  R(g, '#1c2e36', Math.round(W * 0.48), gY - 12, Math.round(W * 0.2), 12);
  for (let x = Math.round(W * 0.48) + 2; x < Math.round(W * 0.68) - 2; x += 3) { R(g, '#cfe8ff', x, gY - 9, 2, 3); if (x % 2) P1(g, '#ffd28a', x, gY - 5); }
  R(g, '#1e2228', 0, Y(58), W, 34);
  for (let x = 0; x < W; x++) if (dith(x, Y(50), 0.15) || dith(x, Y(34), 0.12)) P1(g, '#3a4048', x, x % 2 ? Y(50) : Y(34));
  for (let x = 0; x < W; x += 20) R(g, '#c8ccd4', x, Y(42), 10, 1);
  for (let x = 2; x < W; x += 14) edge.push({ x, y: Y(57) }, { x: x + 7, y: Y(25) });
  for (let i = 0; i < 12; i++) approach.push({ x: Math.round(i * W * 0.025), y: Y(41), i });
  for (let x = 0; x < W; x++) { const h = Math.round(20 + 3 * n(x / 16)); for (let yy = Y(h); yy < H; yy++) P1(g, yy === Y(h) ? '#2a3a3a' : (dith(x, yy, 0.3) ? '#14201f' : '#0f1918'), x, yy); }
  return { c, mills, approach, edge, beacon: { x: tx, y: gY - 123 } };
}
const shS = { px: 0, py: 0, v: 0, landed: false, spray: [] };
function enterLanding() { shS.px = -140; shS.v = 120; shS.landed = false; shS.spray = []; }
function drawLanding(t, dt, st) {
  ctx.drawImage(LA.sky.c, 0, 0);
  const cl = LA.clouds, off = mod(t * 4, cl.cw), w1 = Math.min(W, cl.cw - off);
  ctx.drawImage(cl.c, off, 0, w1, cl.ch, 0, 0, w1, cl.ch); if (w1 < W) ctx.drawImage(cl.c, 0, 0, W - w1, cl.ch, w1, 0, W - w1, cl.ch);
  ctx.drawImage(SH.c, 0, 0);
  for (const m of SH.mills) { for (let k = 0; k < 4; k++) { const a = t * 0.8 + (k * Math.PI) / 2; line(ctx, m.x, m.y, m.x + Math.cos(a) * m.r, m.y + Math.sin(a) * m.r, '#0b181c'); line(ctx, m.x + Math.cos(a) * 4 - Math.sin(a) * 2, m.y + Math.sin(a) * 4 + Math.cos(a) * 2, m.x + Math.cos(a) * m.r - Math.sin(a) * 2, m.y + Math.sin(a) * m.r + Math.cos(a) * 2, '#13262a'); } }
  if ((t % 1.8) < 0.9) P1(ctx, '#ff4d5e', SH.beacon.x, SH.beacon.y);
  for (const e of SH.edge) { P1(ctx, '#fff6dc', e.x, e.y); ctx.globalAlpha = 0.35; P1(ctx, '#fff6dc', e.x, e.y + 1); ctx.globalAlpha = 1; }
  const seq = Math.floor((t * 14) % 14);
  for (const a of SH.approach) { P1(ctx, '#fff6dc', a.x, a.y); if (a.i === seq) { R(ctx, '#ffffff', a.x - 1, a.y - 1, 3, 3); ctx.globalAlpha = 0.4; R(ctx, '#ffffff', a.x - 3, a.y, 7, 1); ctx.globalAlpha = 1; } }
  const tdX = Math.round(W * 0.38) - 64, groundPy = Y(44) - 36, tTouch = 3.6;
  let slope = 0;
  if (st < tTouch) { const f = st / tTouch; shS.px = -140 + (tdX + 140) * f; shS.py = (Y(250) - 36) + (groundPy - (Y(250) - 36)) * (1 - (1 - f) * (1 - f) * 0.15) * f + 0; shS.py = Math.min(groundPy, (Y(250) - 36) + (groundPy - (Y(250) - 36)) * Math.pow(f, 0.85)); slope = f > 0.8 ? 0.05 : 0.02; }
  else { if (!shS.landed) { shS.landed = true; shS.v = 110; } shS.v = Math.max(18, shS.v - 30 * dt); shS.px += shS.v * dt; shS.py = groundPy; if (shS.v > 30) for (let k = 0; k < 3; k++) shS.spray.push({ x: shS.px + 64 + Math.random() * 8, y: Y(44) - 1, vx: -30 - Math.random() * 40, vy: -8 - Math.random() * 16, life: 0 }); }
  for (let i = shS.spray.length - 1; i >= 0; i--) { const p = shS.spray[i]; p.life += dt; if (p.life > 0.7) { shS.spray.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; ctx.globalAlpha = 0.8 - p.life; P1(ctx, '#b8d0d8', p.x, p.y); ctx.globalAlpha = 1; }
  ctx.globalAlpha = 0.25;
  const lx = Math.round(shS.px) + 126;
  for (let i = 1; i < 40; i++) for (let j = -Math.floor(i / 6); j <= Math.floor(i / 6); j++) if (dith(lx + i, Math.round(shS.py) + 30 + j + Math.floor(i / 5), 0.8 - i / 50)) P1(ctx, '#fff4d8', lx + i, Math.round(shS.py) + 30 + j + Math.floor(i / 5));
  ctx.globalAlpha = 1;
  drawPlane(Math.round(shS.px), Math.round(shS.py), slope, true, t);
  drawRain(t, dt, 0, 2);
  if (st > 6.4) startWipe('amsterdam');
}

/* ================= journey manager ================= */
const CITIES = [{ name: 'Zürich', need: 100 }, { name: 'Amsterdam', need: 100 }];
let points = 0, cityIdx = 0, scene = 'city', sceneT = 0, wipe = null, camF = 0, lookX = 0, lookUntil = 0, dragging = false, lastX = 0, nowT = 0, prevCam = 0;
let tmCache = zTime(), tmAt = -9, last = 0, hintGone = false;
const placeEl = document.getElementById('city'), subEl = document.getElementById('sub'), ptsEl = document.getElementById('pts'), barEl = document.getElementById('bar');
const addBtn = document.getElementById('add'), finBtn = document.getElementById('finish'), resetBtn = document.getElementById('reset');
const pointsBefore = () => CITIES.slice(0, cityIdx).reduce((s, c) => s + c.need, 0);
const cityProgress = () => Math.max(0, Math.min(1, (points - pointsBefore()) / CITIES[cityIdx].need));
function updatePanel() {
  const got = Math.max(0, Math.min(CITIES[cityIdx].need, points - pointsBefore()));
  ptsEl.textContent = `${got} of ${CITIES[cityIdx].need} points in ${CITIES[cityIdx].name}`;
  barEl.style.width = `${(got / CITIES[cityIdx].need) * 100}%`;
  const busy = scene !== 'city', last = cityIdx === CITIES.length - 1;
  addBtn.disabled = busy || cityProgress() >= 1; finBtn.disabled = busy || cityProgress() >= 1;
  if (last && cityProgress() >= 1 && !busy) ptsEl.textContent = 'Amsterdam done. Hong Kong is next on the route.';
}
const hideHint = () => { if (!hintGone) { hintGone = true; hintEl.classList.add('gone'); } };
setTimeout(hideHint, 8000);
addBtn.addEventListener('click', () => { points += 20; hideHint(); updatePanel(); });
finBtn.addEventListener('click', () => { points = pointsBefore() + CITIES[cityIdx].need; hideHint(); updatePanel(); });
resetBtn.addEventListener('click', () => { points = 0; cityIdx = 0; scene = 'city'; sceneT = 0; wipe = null; hero.x = 40; hero.v = 0; hero.hidden = false; camF = 0; lookX = 0; updatePanel(); });
cv.addEventListener('pointerdown', e => { if (scene !== 'city') return; dragging = true; lastX = e.clientX; document.body.classList.add('drag'); hideHint(); });
addEventListener('pointermove', e => { if (!dragging) return; lookX -= (e.clientX - lastX) / S; lastX = e.clientX; lookUntil = nowT + 3; });
const endDrag = () => { dragging = false; document.body.classList.remove('drag'); };
addEventListener('pointerup', endDrag); addEventListener('pointercancel', endDrag);
let keyDir = 0;
addEventListener('keydown', e => { if (e.target.tagName === 'BUTTON') return; if (e.key === 'ArrowLeft') keyDir = -1; else if (e.key === 'ArrowRight') keyDir = 1; });
addEventListener('keyup', e => { if ((e.key === 'ArrowLeft' && keyDir < 0) || (e.key === 'ArrowRight' && keyDir > 0)) keyDir = 0; });

function startWipe(to) { if (!wipe) wipe = { t: 0, dur: 1.3, to, switched: false }; }
function ensureScene(name) {
  if (name === 'airport' && !AP) AP = genAirport();
  if (name === 'flight') { if (!FL) FL = genFlight(); if (!LA) buildAmsterdam(); if (!SH) SH = genSchiphol(); }
  if (name === 'landing') { if (!LA) buildAmsterdam(); if (!SH) SH = genSchiphol(); }
  if (name === 'amsterdam' && !LA) buildAmsterdam();
}
function enterScene(to) {
  ensureScene(to);
  sceneT = 0; lookX = 0;
  if (to === 'airport') { scene = 'airport'; enterAirport(); }
  else if (to === 'flight') scene = 'flight';
  else if (to === 'landing') { scene = 'landing'; enterLanding(); }
  else if (to === 'amsterdam') { scene = 'city'; cityIdx = 1; hero.x = -10; hero.v = 30; hero.hidden = false; camF = 0; }
  updatePanel();
}
function drawWipe(dt) {
  if (!wipe) return;
  wipe.t += dt;
  const u = wipe.t / wipe.dur, cover = u < 0.5 ? u * 2 : (1 - u) * 2, B = 8, cols = Math.ceil(W / B), rows = Math.ceil(H / B);
  if (u >= 0.5 && !wipe.switched) { wipe.switched = true; enterScene(wipe.to); }
  ctx.fillStyle = '#0b0c22';
  for (let by = 0; by < rows; by++) for (let bx = 0; bx < cols; bx++) {
    const th = (BAYER[((by & 3) << 2) | (bx & 3)] / 16) * 0.45 + (bx / cols) * 0.5;
    if (th < cover * 1.0) ctx.fillRect(bx * B, by * B, B, B);
  }
  if (u >= 1) wipe = null;
}
function setHud() {
  let name, sub;
  const hh = String(tmCache.h).padStart(2, '0') + ':' + String(tmCache.m).padStart(2, '0');
  if (scene === 'city') { name = CITIES[cityIdx].name; sub = `Stop ${cityIdx + 1} of 6, ${hh} local`; }
  else if (scene === 'airport') { name = 'Zürich Airport'; sub = `Boarding for Amsterdam, ${hh}`; }
  else if (scene === 'flight') { name = 'In the air'; sub = 'Zürich to Amsterdam'; }
  else { name = 'Schiphol'; sub = `Landing in Amsterdam, ${hh}`; }
  if (placeEl.textContent !== name) placeEl.textContent = name;
  if (subEl.textContent !== sub) subEl.textContent = sub;
}
function updateCity(dt) {
  const p = cityProgress(), last = cityIdx === CITIES.length - 1;
  let target = 40 + p * (SPAN + W * 0.55 - 40);
  if (p >= 1 && !last) target = SPAN + W + 80;
  const diff = target - hero.x, want = Math.sign(diff) * Math.min(p >= 1 && !last ? 230 : 110, Math.abs(diff) * 1.4);
  hero.v += (want - hero.v) * Math.min(1, dt * 2.5);
  hero.x += hero.v * dt;
  if (p >= 1 && !last && hero.x > SPAN + W + 30) startWipe('airport');
  const follow = Math.max(0, Math.min(SPAN, hero.x - W * 0.4));
  camF += (follow - camF) * Math.min(1, dt * 2.5);
  if (keyDir) { lookX += keyDir * 160 * dt; lookUntil = nowT + 3; }
  if (!dragging && !keyDir && nowT > lookUntil) lookX *= Math.max(0, 1 - dt * 2);
  lookX = Math.max(-camF, Math.min(SPAN - camF, lookX));
  return Math.max(0, Math.min(SPAN, camF + lookX));
}
function frame(ms) {
  const t = ms / 1000, dt = Math.min(0.05, last ? t - last : 0.016);
  last = t; nowT = t;
  if (t - tmAt > 1) { tmCache = zTime(); tmAt = t; setHud(); }
  if (scene === 'city') {
    const cam = updateCity(dt), dcam = cam - prevCam; prevCam = cam;
    if (cityIdx === 0) drawZurich(t, dt, dcam, cam); else drawAmsterdam(t, dt, dcam, cam);
  } else if (scene === 'airport') drawAirport(t, dt, sceneT);
  else if (scene === 'flight') drawFlight(t, dt, sceneT);
  else drawLanding(t, dt, sceneT);
  sceneT += dt;
  drawWipe(dt);
  requestAnimationFrame(frame);
}
function rebuild() {
  sizeCanvas(); buildZurich();
  AP = FL = SH = null; LA = null;
  if (scene === 'airport') ensureScene('airport');
  if (scene === 'flight' || scene === 'landing' || cityIdx === 1) ensureScene('flight');
  if (cityIdx === 1) ensureScene('amsterdam');
}
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(rebuild, 150); });

/* ================= go ================= */
initActors();
initAmsterdamActors();
SP.plane = genPlane();
SP.boatAF = flip(SP.boatA = genBoatA(), true);
SP.glowBigA = glowSprite(22, '#ffb85a', 0.7); SP.glowMidA = glowSprite(9, '#ffb85a', 0.75); SP.glowSmallA = glowSprite(5, '#ffb85a', 0.8);
for (const k of ['heroRide', 'heroPush', 'heroW1', 'heroW2']) {
  const rows = { heroRide: HERO_RIDE, heroPush: HERO_PUSH, heroW1: HERO_W1, heroW2: HERO_W2 }[k], s = sprite(rows, HERO_PAL);
  SP[k] = { r: s, l: flip(s, true) };
}
rebuild();
updatePanel(); setHud();
requestAnimationFrame(frame);
window.COINT_JOURNEY = {
  addPoints(n) { if (scene === 'city') { points += n; updatePanel(); } },
  setPoints(n) { points = n; updatePanel(); },
  get points() { return points; },
  get scene() { return scene === 'city' ? CITIES[cityIdx].name : scene; }
};
})();
